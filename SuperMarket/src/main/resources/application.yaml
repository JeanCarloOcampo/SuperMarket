spring:
  application:
    name: SuperMarket

  # Configuracion de base de datos MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/micromarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Configuracion de JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update        
    show-sql: true            
    properties:
      hibernate:
        format_sql: true      
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always

server:
  port: 8080
  error:
    include-message: always   